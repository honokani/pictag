[project]
name = "pictag"
version = "0.1.0"
description = "画像ごとのキャプションを辞書から作り、学習用の txt に書き出すローカル Web アプリ"
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.1.3,<4",
    "pandas>=3.0.6,<4",
    "Pillow>=13.0.0,<14",
    "numpy>=2.5.4,<3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "playwright>=1.64.0,<2",
]

[tool.uv]
# パッケージとしてはビルドせず、依存だけ入れる（app.py をそのまま起動する）
package = false
