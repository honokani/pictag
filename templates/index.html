<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>pictag</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="bar">
        <div class="head-main">
            <strong class="app-name">pictag</strong>
            <nav class="tabs" aria-label="画面の切り替え">
                <button type="button" class="tab on" data-view="images" aria-pressed="true">画像</button>
                <button type="button" class="tab" data-view="dictionary" aria-pressed="false">共用辞書</button>
            </nav>
            <label>既存プロジェクト
                <select id="projectSelect">
                    <option value="">選んでください</option>
                </select>
            </label>
            <label class="grow">画像フォルダ
                <input id="imageDir" type="text" placeholder="C:\path\to\images">
            </label>
            <button id="browseButton" type="button" title="このPCでフォルダを選んで読み込む">参照…</button>
            <button id="loadButton" type="button">読み込み</button>
            <button id="renameProjectButton" type="button" disabled title="プロジェクトの名前（画像フォルダ・data_out・data_work のフォルダ名）を変える">改名…</button>
            <span class="group"><span id="statusTime"></span><span id="status" role="status"></span></span>
        </div>
        <button id="saveButton" type="button" class="primary" disabled title="Ctrl+S">保存</button>
    </header>

    <section id="tools" class="bar tools" hidden>
        <form id="sectionForm" class="group">
            <input id="sectionName" type="text" placeholder="段落を追加（例: dog）" autocomplete="off">
            <button type="submit">追加</button>
        </form>
        <label class="group"><input id="showDead" type="checkbox" checked> 削除済み画像を表示</label>
        <button id="removeDeadButton" type="button" title="元フォルダから消えた画像の行を、表から完全に消す（あわせて保存）">削除済みを消す</button>
        <button id="freezeButton" type="button" title="今使っている語句・単語を共用辞書に入れます（使われなくなっても候補に残ります）">共用辞書に入れる</button>
        <!-- キーを移す: 段落（girl A・girl B も）のキーの語句を、ほかのキーへ（開いているプロジェクトの全行と共用辞書）。移す先が同じキーなら置換 -->
        <form id="moveForm" class="group" title="段落（A, B も）のキーの語句を、ほかのキーへ移します。移す先に同じキーを選ぶと、ほかの語句に置き換えます（開いているプロジェクトの全行と共用辞書。保存はまだ）">
            <select id="moveSection" aria-label="移す段落"></select>
            <select id="moveFrom" aria-label="移す元のキー"></select>
            <input id="movePhrase" type="text" placeholder="語句" autocomplete="off" aria-label="移す語句">
            →
            <select id="moveTo" aria-label="移す先のキー"></select>
            <!-- 置換後の語句: 移す先が同じキーのときだけ出す（空白の印の包みごと） -->
            <span id="moveNewField" hidden><input id="moveNew" type="text" placeholder="置換後の語句" autocomplete="off" aria-label="置換後の語句"></span>
            <button id="moveButton" type="submit">移す</button>
        </form>
        <!-- 一括入力: 行を選んでいる間だけ見せる（選んでいないときも場所は取っておき、帯の高さを変えない）。2段に積む -->
        <form id="bulkForm" class="group bulk idle">
            <span class="bulk-row">
                <span id="selectionInfo">選択 0 行</span>
                <select id="bulkSection" aria-label="一括入力の段落"></select>
                <select id="bulkKey" aria-label="一括入力のキー"></select>
            </span>
            <span class="bulk-row">
                <input id="bulkText" type="text" placeholder="語句（例: standing）" autocomplete="off" aria-label="一括入力の語句">
                <button type="submit" value="add" title="選択行に追加">追加</button>
                <button type="submit" value="remove" title="選択行から削除">削除</button>
            </span>
        </form>
        <!-- 📍 続きへ: 最後に書き換えた行（書き換えた時刻がいちばん新しい行）を、列の見出しのすぐ下に見せる。説明は表を読んだときに入れる -->
        <button id="resumeButton" type="button" disabled>📍</button>
    </section>

    <section id="markTools" class="bar tools" hidden>
        <!-- 絞り込み: 押すとその印の行だけ（押した印のどれかがある行）、もう一度押すと外す。段ごとに2段で、記号の真下の ☓ はその印の無い行、
             段の左端の ☓ はその段の印の無い行（☓ は全部に掛ける）。単語の ①〜⑯ は右クリックで語句を選ぶ。ボタンは表を読んだときに入れる -->
        <span id="markFilters" class="group mark-filters">
            <span class="filter-group" data-kind="one" data-label="排他"></span>
            <span class="filter-group" data-kind="many" data-label="複数"></span>
            <span id="autoMarks" class="filter-group" data-kind="auto" data-label="単語"></span>
        </span>
        <button id="selectVisibleButton" type="button" title="見えている行をすべて選ぶ（Ctrl+A）">表示中を選択</button>
        <!-- 行を選んでいる間だけ出す -->
        <button type="button" id="deselectButton" class="hold" title="1秒長押しで、選択を解除" hidden>選択解除</button>
        <!-- マークのクリア（右端）。名前（A〜H など）は表を読んだときに marks.py の記号の表から入れる -->
        <span id="markTools-clear" class="group clear-marks">
            <button type="button" class="hold" data-column="mark" title="1秒長押しで、全行の排他のマークを消す">排他をクリア</button>
            <button type="button" class="hold" data-column="marks" title="1秒長押しで、全行の複数のマークを消す">複数をクリア</button>
        </span>
    </section>

    <main id="imagesView">
        <table id="grid">
            <thead><tr id="gridHead"></tr></thead>
            <tbody id="gridBody"></tbody>
        </table>
        <p id="emptyNote">画像フォルダを読み込むか、既存プロジェクトを選んでください。</p>
    </main>

    <!-- 共用辞書の画面（タブで切り替え）。語句は「キー: 語句」で1行（段落をまたいでまとめる） -->
    <section id="dictTools" class="bar tools" hidden>
        <!-- 検索: 空白で区切った語の全部が合う行（以外を表示なら合わない行）。「.」で始まる語は kind（キーの .looks・kind の ._face など）の名前とだけ、
             ほかの語は語句と kind の名前のどれかと比べる。打っている間はあいまい、検索か Enter で文字どおり（また打つとあいまいに戻る）。
             リセットは、検索の文字・対象 / 以外・共用辞書を初めに戻す -->
        <span class="group">
            <button type="button" id="dictResetButton" title="検索の文字を消し、「対象を表示」と「共用辞書: すべて」に戻す">リセット</button>
            <input id="dictFilter" type="text" placeholder="検索（例: .looks stand）" autocomplete="off" aria-label="語句・キー・kind で検索">
            <select id="dictFilterMode" aria-label="検索に合う行を出すか、合わない行を出すか">
                <option value="in">対象を表示</option>
                <option value="out">以外を表示</option>
            </select>
            <button type="button" id="dictSearchButton" title="打った語がそのまま入っている行だけに絞る（Enter でも。また打つと、あいまいな検索に戻る）">検索</button>
            <select id="dictShared" aria-label="共用辞書に入っているかで絞り込み">
                <option value="">共用辞書: すべて</option>
                <option value="in">共用辞書にある</option>
                <option value="out">共用辞書にない</option>
            </select>
        </span>
        <span id="dictCount" class="key-help"></span>
        <form id="dictAddForm" class="group add-entry">
            <select id="dictAddSection" aria-label="足す語句の段落"></select>
            <select id="dictAddKey" aria-label="足す語句のキー"></select>
            <input id="dictAddText" type="text" placeholder="新しい語句" autocomplete="off" aria-label="足す語句">
            <button type="submit">共用辞書に足す</button>
        </form>
    </section>

    <section id="dictSelTools" class="bar tools" hidden>
        <span id="dictHelp" class="key-help">行を選ぶと（Ctrl で足し引き、Shift で範囲）、まとめて 共用辞書に入れる・kind を付与する・消す ができます</span>
        <span id="dictSelForm" class="group bulk" hidden>
            <span id="dictSelInfo">選択 0 件</span>
            <button type="button" id="dictRegisterButton">共用辞書に入れる</button>
            <button type="button" id="dictGroupButton" title="同じキーの語句に kind（2階のタグ）を付与する。名前・前後の決まり・排他制限を選べる">kindを付与する</button>
            <button type="button" id="dictUngroupButton">kindから外す</button>
            <button type="button" id="dictUnregisterButton" class="hold" title="1秒長押しで、選んだ語句を共用辞書から消す（入力はそのまま）">共用辞書から消す</button>
            <button type="button" id="dictDeselectButton">選択を外す</button>
        </span>
        <label class="group rename-option" title="改名したとき、開いているプロジェクトの入力の語句も新しい名前にする（他のプロジェクトは変えない）">
            <input id="dictRenameInProject" type="checkbox" checked> 改名で、開いているプロジェクトの入力も置き換える
        </label>
    </section>

    <!-- 共用辞書の画面: 左半分に表（改名の列の右端が真ん中）、右半分の上に最後に選んだ語句の画像、下に全部の kind -->
    <main id="dictView" hidden>
        <div id="dictLeft" class="dict-pane">
        <table id="dictGrid">
            <thead><tr>
                <th><input id="dictAll" type="checkbox" aria-label="表示中をすべて選択"></th>
                <!-- 段落: その語句を候補に出す段落。キー・kind・語句は ▲（昇順）▼（降順）で並べ替える。同じものをもう一度押すと元の並び -->
                <th>段落</th>
                <th>キー<button type="button" class="sort" data-sort="key" data-dir="1" title="キーの昇順">▲</button><button type="button" class="sort" data-sort="key" data-dir="-1" title="キーの降順">▼</button></th>
                <th>kind<button type="button" class="sort" data-sort="kind" data-dir="1" title="kind の昇順（kind の無い行は後ろ）">▲</button><button type="button" class="sort" data-sort="kind" data-dir="-1" title="kind の降順（kind の無い行は後ろ）">▼</button></th>
                <th>語句<button type="button" class="sort" data-sort="text" data-dir="1" title="語句の昇順">▲</button><button type="button" class="sort" data-sort="text" data-dir="-1" title="語句の降順">▼</button></th>
                <th>回数</th><th>辞書</th><th></th>
            </tr></thead>
            <tbody id="dictBody"></tbody>
        </table>
        <p id="dictEmpty" hidden>表示する語句がありません。画像の画面で入力するか、上の欄で語句を足してください。</p>
        </div>
        <div id="dictRight">
            <!-- 最後に選んだ語句を使っている、開いているプロジェクトの画像（クリックで下に画像の画面の行、ダブルクリックで画像の画面のその行へ） -->
            <section id="dictImages" class="dict-pane dict-side" aria-label="語句を使っている画像">
                <p id="dictImagesNote" class="key-help"></p>
                <div id="dictImageList" class="dict-thumbs"></div>
            </section>
            <!-- 簡易表示: クリックした画像の、画像の画面の行のサムネイルと段落の欄（見るだけ。サムネイルのクリックで画像の画面のその行へ） -->
            <section id="dictRowView" class="dict-pane dict-side" aria-label="画像の画面の行">
                <p id="dictRowNote" class="key-help"></p>
                <table id="dictRowTable" hidden><thead><tr></tr></thead><tbody></tbody></table>
            </section>
            <!-- 全部の kind: 印・キー・排他制限・改名と、仲間の語句（クリックで左の表のその行へ） -->
            <section id="dictKinds" class="dict-pane dict-side" aria-label="kind の一覧">
                <p id="dictKindsNote" class="key-help"></p>
                <div id="dictKindList"></div>
            </section>
        </div>
    </main>

    <ul id="suggestions" class="suggestions" role="listbox" hidden></ul>

    <!-- 単語のマークの設定（帯の ①〜⑯ を右クリックで、その下に開く） -->
    <form id="autoMarkForm" class="group auto-mark-form" hidden>
        <span id="autoMarkLabel"></span>
        <select id="autoMarkSection" aria-label="単語のマークの段落"></select>
        <select id="autoMarkKey" aria-label="単語のマークのキー"></select>
        <input id="autoMarkPhrase" type="text" placeholder="語句" autocomplete="off" aria-label="単語のマークの語句">
        <button type="submit">決める</button>
        <button type="button" id="autoMarkClear">外す</button>
    </form>

    <dialog id="imageDialog">
        <form method="dialog"><button class="close" aria-label="閉じる">×</button></form>
        <p id="imageTitle"></p>
        <img id="imageFull" alt="">
    </dialog>

    <dialog id="verbDialog" aria-label="動詞の形をそろえる">
        <form method="dialog"><button class="close" aria-label="閉じる">×</button></form>
        <p id="verbSummary"></p>
        <div id="verbLists"></div>
        <p class="verb-actions"><button type="button" id="verbApply">入れる</button></p>
    </dialog>

    <!-- 改名…: 新しい名前が画像フォルダ・data_out・data_work のフォルダ名になる。Enter か 改名 で決め、Esc か やめる でやめる -->
    <dialog id="renameDialog" aria-label="プロジェクトの改名">
        <form method="dialog" class="rename-form">
            <label for="renameName">新しい名前（画像フォルダ・data_out・data_work のフォルダ名を変えます）</label>
            <input id="renameName" type="text" autocomplete="off" spellcheck="false">
            <p class="rename-actions">
                <button type="submit" value="rename" class="primary">改名</button>
                <button type="submit" value="cancel">やめる</button>
            </p>
        </form>
    </dialog>

    <!-- kind: 新しく付与するときと、印をダブルクリックしたときに開く。suffix / prefix を選ぶと、名前で終わる / 始まる同じキーの語句も
         いつも仲間になる（名前の前後の空白もそのまま比べる）。名前が空なら番号（K1 …）。排他制限なら、1枚の画像の1段落に仲間を1つだけ -->
    <dialog id="groupDialog" aria-label="kind">
        <form method="dialog" class="group-form">
            <label for="groupName">kind の名前（空なら番号。前後の空白もそのまま比べる）</label>
            <input id="groupName" type="text" autocomplete="off" spellcheck="false">
            <p class="group-affix">
                <label><input type="radio" name="groupAffix" value="suffix" checked> suffix（後ろが共通。印は _名前）</label>
                <label><input type="radio" name="groupAffix" value="prefix"> prefix（前が共通。印は 名前_）</label>
                <label><input type="radio" name="groupAffix" value=""> そのまま（前後の決まりなし）</label>
            </p>
            <label class="group-affix"><input id="groupExclusive" type="checkbox" checked> 排他制限</label>
            <p class="rename-actions">
                <button type="submit" value="ok" class="primary">決める</button>
                <button type="submit" value="cancel">やめる</button>
            </p>
        </form>
    </dialog>

    <script src="/static/control.js"></script>
    <script src="/static/dictionary.js"></script>
</body>
</html>
